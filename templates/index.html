<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/9.1.6/marked.min.js"></script>
    <title>Notegoo</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background: #05050a;
            color: #e8e8ee;
            margin: 0;
            display: flex;
            justify-content: center;
            padding: 24px;
            overflow: hidden;
            height: 100vh;
        }

        /* ===== Animated background ===== */
        #chat {
            position: relative;
            /* add this */
            flex: 1;
            overflow-y: auto;
            padding: 26px 60px;
        }

        #bg-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
        }

        .sphere {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 140px;
            height: 140px;
            transform: translate(-50%, -50%);
            border-radius: 50%;
            background: radial-gradient(circle at 35% 30%, #a78bfa, #6366f1 55%, #312e81 100%);
            box-shadow: 0 0 60px 10px rgba(139, 92, 246, 0.5), 0 0 120px 40px rgba(99, 102, 241, 0.25);
            animation: pulse 4s ease-in-out infinite;
            opacity: 0.55;
            z-index: 0;
        }

        @keyframes pulse {

            0%,
            100% {
                transform: translate(-50%, -50%) scale(1);
            }

            50% {
                transform: translate(-50%, -50%) scale(1.08);
            }
        }

        .line-path {
            stroke: url(#lineGradient);
            stroke-width: 1.2;
            fill: none;
            opacity: 0.35;
            stroke-dasharray: 6 10;
            animation: dash 18s linear infinite;
        }

        @keyframes dash {
            to {
                stroke-dashoffset: -400;
            }
        }

        /* ===== App shell ===== */
        #app {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 920px;
            background: rgba(20, 20, 30, 0.55);
            -webkit-backdrop-filter: blur(14px);
            backdrop-filter: blur(14px);
            border-radius: 18px;
            overflow: hidden;
            border: 1px solid #2a2a38;
            display: flex;
            flex-direction: column;
            height: 90vh;
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.5);
        }

        #header {
            padding: 18px 24px;
            border-bottom: 1px solid #26262f;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        #header .logo {
            width: 34px;
            height: 34px;
            border-radius: 10px;
            background: linear-gradient(135deg, #8b5cf6, #6366f1);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            font-weight: bold;
            color: white;
        }

        #header h1 {
            font-size: 16px;
            margin: 0;
            font-weight: 600;
        }

        #header p {
            font-size: 12px;
            color: #9a9aab;
            margin: 2px 0 0;
        }

        #chat {
            flex: 1;
            overflow-y: auto;
            padding: 26px 60px;
        }

        #chat:empty::before {
            content: "Attach your notes, or just ask a question 👋";
            color: #7a7a8c;
            font-size: 14px;
            display: block;
            text-align: center;
            margin-top: 60px;
        }

        .msg {
            display: flex;
            margin: 14px 0;
            position: relative;
            z-index: 1;
        }

        .msg.user {
            justify-content: flex-end;
        }

        .bubble {
            max-width: 70%;
            padding: 12px 16px;
            border-radius: 16px;
            line-height: 1.55;
            font-size: 14px;
        }

        .bubble table {
            border-collapse: collapse;
            width: 100%;
            margin: 10px 0;
            font-size: 13px;
        }

        .bubble th,
        .bubble td {
            border: 1px solid #2b2b38;
            padding: 8px 10px;
            text-align: left;
        }

        .bubble th {
            background: #23232f;
            color: #c4b5fd;
        }

        .bubble tr:nth-child(even) {
            background: rgba(255, 255, 255, 0.02);
        }

        .bubble strong {
            color: #c4b5fd;
            font-weight: 600;
        }

        .bubble ul,
        .bubble ol {
            margin: 8px 0;
            padding-left: 22px;
        }

        .bubble li {
            margin: 4px 0;
        }

        .bubble h1,
        .bubble h2,
        .bubble h3 {
            margin: 12px 0 6px 0;
            color: #e8e8ee;
        }

        .bubble p {
            margin: 0 0 10px 0;
        }

        .bubble p:last-child {
            margin-bottom: 0;
        }

        .bubble pre {
            background: #0d0d13;
            border: 1px solid #2b2b38;
            border-radius: 8px;
            padding: 12px 14px;
            overflow-x: auto;
            margin: 8px 0;
        }

        .bubble pre code {
            font-family: 'Consolas', 'Courier New', monospace;
            font-size: 13px;
            white-space: pre;
            color: #a5e8c1;
            line-height: 1.5;
        }

        .user .bubble {
            background: linear-gradient(135deg, #8b5cf6, #6366f1);
            color: white;
            border-bottom-right-radius: 4px;
        }

        .ai .bubble {
            background: rgba(33, 33, 44, 0.85);
            border: 1px solid #2b2b38;
            border-bottom-left-radius: 4px;
        }

        .audio-player {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-top: 10px;
            background: #15151d;
            padding: 8px 12px;
            border-radius: 10px;
        }

        .audio-player button {
            background: #8b5cf6;
            border: none;
            color: white;
            width: 28px;
            height: 28px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 12px;
        }

        .audio-player audio {
            display: none;
        }

        .audio-player .duration {
            font-size: 12px;
            color: #8a8a9a;
            margin-left: auto;
        }

        #fileChip,
        #explainChip {
            padding: 0 60px;
            margin-top: 8px;
            display: none;
        }

        #fileChip span {
            background: #21212c;
            border: 1px solid #2b2b38;
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 13px;
        }

        #fileChip button {
            background: none;
            border: none;
            color: #e57373;
            cursor: pointer;
            margin-left: 6px;
            font-size: 13px;
        }

        #explainChip button {
            background: #21212c;
            border: 1px solid #8b5cf6;
            color: #c4b5fd;
            padding: 6px 14px;
            border-radius: 16px;
            cursor: pointer;
            font-size: 13px;
        }

        #loading {
            text-align: center;
            color: #8a8a9a;
            font-size: 13px;
            padding: 6px;
            display: none;
        }

        #inputBar {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 18px 24px;
            border-top: 1px solid #26262f;
            background: rgba(25, 25, 34, 0.6);
        }

        #attachBtn {
            cursor: pointer;
            font-size: 17px;
            color: #8a8a9a;
            padding: 6px;
        }

        #questionInput {
            flex: 1;
            background: #21212c;
            border: 1px solid #2b2b38;
            border-radius: 22px;
            padding: 11px 18px;
            color: white;
            resize: none;
            font-size: 14px;
            outline: none;
        }

        #questionInput:focus {
            border-color: #8b5cf6;
        }

        #voiceSelect {
            background: #21212c;
            border: 1px solid #2b2b38;
            color: #e8e8ee;
            border-radius: 20px;
            padding: 9px 12px;
            font-size: 12px;
            outline: none;
        }

        #sendBtn {
            background: linear-gradient(135deg, #8b5cf6, #6366f1);
            border: none;
            color: white;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 15px;
        }

        #fileInput {
            display: none;
        }

        .sphere {
            z-index: 0;
            position: fixed;
        }

        .path-delay-4 {
            animation-delay: -4s;
        }

        .path-delay-9 {
            animation-delay: -9s;
        }
    </style>
</head>

<body>

    <!-- Animated background -->
    <svg id="bg-canvas" xmlns="http://www.w3.org/2000/svg">
        <defs>
            <linearGradient id="lineGradient" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#8b5cf6" />
                <stop offset="100%" stop-color="#22d3ee" />
            </linearGradient>
        </defs>
        <path class="line-path" d="M -100,600 C 300,100 700,900 1400,200" />
        <path class="line-path path-delay-4" d="M -100,100 C 400,700 800,100 1500,600" />
        <path class="line-path path-delay-9" d="M -100,900 C 500,300 900,800 1500,50" />
    </svg>


    <div id="app">
        <div id="header">
            <div class="logo">N</div>
            <div>
                <h1>Notegoo</h1>
                <p>Your multilingual study companion</p>
            </div>
        </div>

        <div id="chat">
            <svg id="bg-canvas" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" preserveAspectRatio="none">
                <defs>
                    <linearGradient id="lineGradient" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" stop-color="#8b5cf6" />
                        <stop offset="100%" stop-color="#22d3ee" />
                    </linearGradient>
                </defs>
                <path class="line-path" d="M -50,400 C 200,50 500,550 950,150" />
                <path class="line-path path-delay-4" d="M -50,80 C 300,450 600,50 950,400" />
                <path class="line-path path-delay-9" d="M -50,550 C 350,200 650,500 950,20" />
            </svg>
            <div class="sphere"></div>
        </div>
        <div id="loading">Thinking... ⏳</div>

        <div id="explainChip"><button onclick="explainDocument()">📄 Explain this document</button></div>
        <div id="fileChip"><span id="fileChipName"></span><button onclick="clearFile()">✕</button></div>

        <div id="inputBar">
            <label id="attachBtn" for="fileInput">📎</label>
            <input type="file" id="fileInput" accept=".pdf">
            <textarea id="questionInput" rows="1" placeholder="Ask a question..."></textarea>
            <select id="voiceSelect" aria-label="Select voice" title="Select voice">
                <option value="English-Male" selected>English (Male)</option>
                <option value="English-Female">English (Female)</option>
                <option value="Hindi-Male">Hindi (Male)</option>
                <option value="Hindi-Female">Hindi (Female)</option>
                <option value="Gujarati-Male">Gujarati (Male)</option>
                <option value="Gujarati-Female">Gujarati (Female)</option>
            </select>
            <button id="sendBtn" onclick="sendMessage()">➤</button>
        </div>
    </div>

    <script>
        const chat = document.getElementById('chat');
        const fileInput = document.getElementById('fileInput');
        const fileChip = document.getElementById('fileChip');
        const explainChip = document.getElementById('explainChip');

        function addMessage(text, sender, audioUrl = null) {
            const div = document.createElement('div');
            div.className = `msg ${sender}`;
            const bubble = document.createElement('div');
            bubble.className = 'bubble';

            renderFormattedText(bubble, text);

            if (audioUrl) {
                const player = document.createElement('div');
                player.className = 'audio-player';

                const btn = document.createElement('button');
                btn.innerText = '▶';

                const audio = document.createElement('audio');
                audio.src = audioUrl;

                const duration = document.createElement('span');
                duration.className = 'duration';
                duration.innerText = '0:00';

                audio.addEventListener('loadedmetadata', () => {
                    const mins = Math.floor(audio.duration / 60);
                    const secs = Math.floor(audio.duration % 60).toString().padStart(2, '0');
                    duration.innerText = `${mins}:${secs}`;
                });

                btn.onclick = () => {
                    if (audio.paused) { audio.play(); btn.innerText = '⏸'; }
                    else { audio.pause(); btn.innerText = '▶'; }
                };
                audio.onended = () => { btn.innerText = '▶'; };

                player.appendChild(btn);
                player.appendChild(duration);
                player.appendChild(audio);
                bubble.appendChild(player);
            }

            div.appendChild(bubble);
            chat.appendChild(div);
            chat.scrollTop = chat.scrollHeight;
        }

        function renderFormattedText(container, text) {
            container.innerHTML = marked.parse(text);
        }

        fileInput.addEventListener('change', async () => {
            if (!fileInput.files.length) return;
            const formData = new FormData();
            formData.append('pdf_file', fileInput.files[0]);

            document.getElementById('loading').style.display = 'block';
            document.getElementById('loading').innerText = 'Uploading & processing document... ⏳';

            try {
                const res = await fetch('/upload', { method: 'POST', body: formData });
                const data = await res.json();

                document.getElementById('loading').style.display = 'none';
                document.getElementById('loading').innerText = 'Thinking... ⏳';

                if (data.error) { alert(data.error); return; }

                document.getElementById('fileChipName').innerText = `📄 ${data.filename}`;
                fileChip.style.display = 'flex';   // ensure it shows, 'flex' not just 'block'
                explainChip.style.display = 'block';
            } catch (err) {
                document.getElementById('loading').style.display = 'none';
                alert('Upload failed: ' + err.message);
            }
        });

        async function clearFile() {
            await fetch('/clear_file', { method: 'POST' });
            fileChip.style.display = 'none';
            explainChip.style.display = 'none';
            fileInput.value = '';
        }

        async function explainDocument() {
            await runRequest({ explain_full: true }, "Explain this document");
        }

        async function sendMessage() {
            const question = document.getElementById('questionInput').value.trim();
            if (!question) return;
            document.getElementById('questionInput').value = '';
            await runRequest({ question }, question);
        }

        async function runRequest(payload, displayText) {
            addMessage(displayText, 'user');
            document.getElementById('loading').style.display = 'block';

            payload.voice = document.getElementById('voiceSelect').value;

            try {
                const res = await fetch('/process', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                const data = await res.json();
                document.getElementById('loading').style.display = 'none';

                if (data.error) { addMessage("⚠️ " + data.error, 'ai'); return; }
                addMessage(data.text, 'ai', data.audio_url);

            } catch (err) {
                document.getElementById('loading').style.display = 'none';
                addMessage("⚠️ Something went wrong: " + err.message, 'ai');
            }
        }

        document.getElementById('questionInput').addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
        });
    </script>
</body>

</html>
